<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Projeto - Studys</title>
    <link rel="stylesheet" href="projeto.css">
</head>
<body>
    <div class="main-container">
        <header class="capa-projeto">
            <img src="sua-imagem-aqui.jpg" alt="Capa do Projeto">
            <div class="overlay-titulo">
                <span class="tag web3-bg">Web 3.0</span> 
                <h1>Título do Estudo de Caso</h1>
            </div>
        </header>

        <main class="conteudo-projeto">
            <section class="audio-section">
                <h3>Ouça os Insights da Estratégia</h3>
                <audio controls>
                    <source src="seu-audio.mp3" type="audio/mpeg">
                    Seu navegador não suporta o player de áudio.
                </audio>
            </section>

            <section class="texto-projeto">
                <p>Aqui você insere a descrição detalhada do seu raciocínio estratégico, métricas RICE e aprendizados.</p>
                
                <div class="anexos-container">
                    <a href="#" class="btn-anexo">📄 Ver PDF</a>
                    <a href="#" class="btn-anexo">🖼️ Ver PNG</a>
                </div>
            </section>

            <section class="comentarios-section">
                <h3>Deixe seu Feedback</h3>
                <form class="form-comentarios">
                    <input type="email" placeholder="Seu e-mail profissional" required>
                    <textarea placeholder="O que você achou desta estratégia?"></textarea>
                    <button type="submit" class="btn-enviar">Enviar Mensagem</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
